[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "trace"
version = "0.1.0"
description = "Temporal Rewilding Analysis for Changepoint Estimation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "plotly>=6.7.0",
    "pyyaml>=6.0.3",
    "pytest>=8.0",
    "scipy>=1.17.1",
    "rpy2>=3.6",
    "statsmodels>=0.14.6",
    "streamlit>=1.57.0",
]

[project.scripts]
trace-sim = "tracepy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import order)
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["tracepy"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
